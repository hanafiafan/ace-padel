name: ace_padel
description: Ace Padel - padel court reservation app by hellens.dev.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  http: ^1.2.0
  google_sign_in: ^6.2.2
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^4.0.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  # Push notifications (FCM) + local display. Aktif penuh setelah
  # google-services.json / GoogleService-Info.plist ditambahkan — lihat FCM_SETUP.md.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Display
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
