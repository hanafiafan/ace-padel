appId: dev.hellens.ace_padel
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Lihat-lihat dulu sebagai Tamu"
    commands:
      - tapOn: ".*Lihat-lihat dulu sebagai Tamu.*"
- tapOn: ".*Courts.*Tab.*"
- assertVisible: ".*CARI LAPANGAN.*"
- tapOn: ".*PETA.*"
- assertVisible: ".*PETA CLUSTER VENUE.*"
- assertVisible: ".*JAKARTA SELATAN \\(6 ARENA\\).*"
- back
- tapOn: ".*Ranking.*Tab.*"
- assertVisible: ".*LEADERBOARD.*"
- tapOn: ".*Bookings.*Tab.*"
- assertVisible: ".*BOOKING SAYA.*"
- tapOn: ".*Profile.*Tab.*"
- assertVisible: ".*PROFIL SAYA.*"
- assertVisible: ".*YOUR MOMENTUM.*"
- tapOn: ".*Home.*Tab.*"
- assertVisible: ".*Padel Action Now.*"
